# UNVERIFIED in sandbox; run locally with `docker compose up`.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RESQFLOW_SECRET=${RESQFLOW_SECRET:-change-me-in-prod}
    volumes:
      - ./data/processed:/app/data/processed
    restart: unless-stopped
